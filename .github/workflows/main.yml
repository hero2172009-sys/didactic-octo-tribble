name: Fiyat Botu

on:
  schedule:
    - cron: '*/10 * * * *' # Her 10 dakikada bir çalışır
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari İndir
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutuphaneleri Yukle
        run: pip install requests beautifulsoup4 pyTelegramBotAPI

      - name: Botu Calistir
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
